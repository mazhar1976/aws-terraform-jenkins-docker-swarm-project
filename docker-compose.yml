services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://inventory:inventorypass@db:5432/inventoryhub
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventorypass
      POSTGRES_DB: inventoryhub
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventoryhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  inventory_data:
